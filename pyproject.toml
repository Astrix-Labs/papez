[project]
name = "papez"
dynamic = ["version"]
description = "Papez: the open-source memory engine for AI agents. Multiplicative scoring, a causal graph, lifecycle management, and active forgetting"
readme = "README.md"
authors = [{name = "Papez Contributors"}]
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
keywords = ["memory", "ai", "mcp", "causal-graph", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "mcp>=1.0.0,<2",  # 2.x removed Server.list_tools/call_tool decorators; 2.x support is tracked separately
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.30.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
local = [
    "sentence-transformers>=2.2.0",
]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
papez = "papez.__main__:main"

[project.urls]
Homepage = "https://github.com/Astrix-Labs/papez"
Repository = "https://github.com/Astrix-Labs/papez"
Issues = "https://github.com/Astrix-Labs/papez/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.build-hook.vcs]
version-file = "src/papez/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["shim", "benchmarks", ".github", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/papez"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
